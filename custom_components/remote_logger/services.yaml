flush:
  name: Flush
  description: >
    Immediately flush all buffered log records to the remote endpoint.

last_log:
  name: Last Log
  description: >
    Return the JSON content of the last log message sent for a specific configuration.
  fields:
    config_entry_id:
      name: Configuration
      description: The remote logger configuration to query.
      required: true
      selector:
        config_entry:
          integration: remote_logger

send_log:
  name: Create Log Event
  description: >
    Create a custom log event.
  fields:
    event:
      name: Event
      description: Name of event to generate
      required: true
      selector:
        text:
    message:
      name: Message
      description: The log message body.
      required: true
      selector:
        text:
    level:
      name: Level
      description: Severity level.
      required: false
      default: INFO
      selector:
        select:
          options:
            - DEBUG
            - INFO
            - WARNING
            - ERROR
            - CRITICAL
    attributes:
      name: Attributes
      description: Optional key-value attributes to attach to the log record.
      required: false
      selector:
        object:
