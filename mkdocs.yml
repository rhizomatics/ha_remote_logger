site_name: Home Assistant Remote Logger
site_url: https://remote-logger.rhizomatics.org.uk
site_description: Remote Logging for Home Assistant using Syslog or OTEL

repo_name: rhizomatics/remote_logger
repo_url: https://github.com/rhizomatics/remote_logger
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  highlightjs: true
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search
    - search.share
    - toc.follow
    - toc.integrate
plugins:
  - search
  - autorefs
  - pagetree
  - optimize
  - meta-descriptions
  - tags
  - htmlproofer:
      skip_downloads: True
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
  - coverage:
      page_path: developer/coverage
      html_report_dir: htmlcov
  - mkdocstrings:
      handlers:
      # See: https://mkdocstrings.github.io/python/usage/
        python:
          options:
            show_source: false
            show_root_heading: true
            summary: true
            show_inheritance_diagram: false
            overloads_only: true
            show_if_no_docstring: false


extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Nederlands
      link: /nl/
      lang: nl
    - name: Français
      link: /fr/
      lang: fr
    - name: Deutsch
      link: /de/
      lang: de
    - name: हिन्दी
      link: /hi/
      lang: hi
    - name: Italiano
      link: /it/
      lang: it
    - name: 日本語
      link: /ja/
      lang: ja
    - name: Polski
      link: /pl/
      lang: pl
    - name: Português
      link: /pt/
      lang: pt
    - name: 简体中文
      link: /zh/
      lang: zh
    - name: Español
      link: /es/
      lang: es

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - sane_lists
  - pymdownx.snippets:
      check_paths: true
